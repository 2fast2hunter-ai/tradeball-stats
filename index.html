*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,sans-serif}
header{padding:16px 20px;border-bottom:1px solid var(--bd);display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.k{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px}.k b{display:block;font-size:22px;margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:14px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;overflow:auto;max-height:520px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:5px 8px;text-align:right;border-bottom:1px solid var(--bd);white-space:nowrap}
th:first-child,td:first-child{text-align:left}th{color:var(--mu);position:sticky;top:0;background:var(--card);cursor:pointer}
.pos{color:var(--g)}.neg{color:var(--r)}.tag{font-size:11px;padding:1px 6px;border-radius:8px;background:#23863633;color:var(--g)}.tag.off{background:#30363d;color:var(--mu)}
@media(max-width:500px){.grid{grid-template-columns:1fr}.k b{font-size:18px}}

 tbl('t_bot',agg(R,b=>b.b),{label:'Bot',extra:r=>` <span class="tag ${act.has(r.k)?'':'off'}">${act.has(r.k)?'aktiv':'inaktiv'}</span>`});
 tbl('t_day',agg(R,b=>b.t.slice(0,10)),{sort:'k',label:'Tag'});
 tbl('t_week',agg(R,b=>isoWeek(new Date(b.t))),{sort:'k',label:'Woche'});
 tbl('t_month',agg(R,b=>b.t.slice(0,7)),{sort:'k',label:'Monat'});
 const mn=+$('fmin').value,T=agg(R,b=>[b.h,b.a].filter(Boolean)).filter(r=>r.n>=mn);
 tbl('t_tb',T.filter(r=>r.p>0),{label:'Team',limit:25});tbl('t_tw',T.filter(r=>r.p<0),{label:'Team',desc:false,limit:25});
 tbl('t_comp',agg(R,b=>b.c),{label:'Liga'});tbl('t_co',agg(R,b=>b.co),{label:'Land'});
 tbl('t_mk',agg(R,b=>b.ty+' · '+b.mo),{label:'Markt'});
 const ob=o=>o<1.5?'< 1,50':o<1.7?'1,50–1,69':o<1.9?'1,70–1,89':o<2.1?'1,90–2,09':o<2.5?'2,10–2,49':'≥ 2,50';
 tbl('t_od',agg(R,b=>ob(b.o)),{sort:'k',desc:false,label:'Quote'});
 tbl('t_wd',agg(R,b=>{const d=new Date(b.t).getDay();return ((d+6)%7+1)+' '+WD[d]}),{sort:'k',desc:false,label:'Tag'});
 tbl('t_hr',agg(R,b=>b.t.slice(11,13)+' Uhr'),{sort:'k',desc:false,label:'Stunde'});
 tbl('t_bk',agg(R,b=>b.bk),{label:'Buchmacher'});
 const RN={W:'Gewonnen',L:'Verloren',P:'Push',HW:'Halb gewonnen',HL:'Halb verloren'};tbl('t_res',agg(R,b=>RN[b.r]||b.r),{label:'Ergebnis'});
 $('t_last').innerHTML='<table><tr><th>Zeit</th><th>Bot</th><th>Spiel</th><th>Liga</th><th>Tipp</th><th>Quote</th><th>Einsatz</th><th>Erg.</th><th>Bilanz</th></tr>'+R.slice(-100).reverse().map(b=>`<tr><td>${b.t.replace('T',' ')}</td><td>${b.b}</td><td style="text-align:left">${b.h} – ${b.a}</td><td style="text-align:left">${b.c}</td><td>${b.s}</td><td>${b.o.toFixed(2)}</td><td>${b.st}</td><td>${b.r}</td><td class="${cls(b.p)}">${eur(b.p)}</td></tr>`).join('')+'</table>';}
['fbot','fper','fmode','fmin','fd1','fd2'].forEach(i=>$(i).onchange=()=>{$('fd1').hidden=$('fd2').hidden=$('fper').value!=='c';render()});render();
</script></body></html>
